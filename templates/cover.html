<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome — Kwalitec Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <section class="cover-hero">
            <div class="cover-content">
                <div class="cover-text">
                    <div class="tagline fade-up">
                        <span class="tag-icon" aria-hidden="true">
                            <!-- small colorful stack icon -->
                            <svg width="18" height="14" viewBox="0 0 24 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="1" y="1" width="8" height="6" rx="1.2" fill="#7c3aed" />
                                <rect x="8" y="4" width="8" height="6" rx="1.2" fill="#0ea5e9" />
                                <rect x="15" y="2" width="8" height="6" rx="1.2" fill="#34d399" />
                            </svg>
                        </span>
                        Personal Library
                    </div>
                    <h1 class="fade-up delay">Welcome to Kwalitec Reading Library</h1>
                    <p class="lead fade-up delay-lg">A curated library of my reading journey and ratings.</p>
                    <div class="cover-actions fade-up delay-lg">
                        <a class="cta-btn" href="/authors" aria-label="Enter Library">
                            <span class="cta-icon">➜</span>
                            <span class="cta-text">Enter Library</span>
                        </a>
                    </div>
                </div>
                <div class="cover-image fade-up delay">
                    <div class="cover-card">
                        <img src="{{ url_for('static', filename='cover.jpg') }}" alt="Cover" onerror="this.style.display='none'">
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
