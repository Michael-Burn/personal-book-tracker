{# Grid / List view toggle. Optional: toggle_id (default viewToggle) #}
{% set tid = toggle_id if toggle_id is defined else 'viewToggle' %}
<div class="lib-view-toggle" id="{{ tid }}" role="group" aria-label="Library view mode">
    <button type="button" class="lib-view-btn is-active" data-view="grid" aria-pressed="true" title="Grid view">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Grid</span>
    </button>
    <button type="button" class="lib-view-btn" data-view="list" aria-pressed="false" title="List view">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>List</span>
    </button>
</div>
